<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — BabyCare</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar-figma">
    <div class="logo-group">
      <div class="logo-badge">
        <img src="../assets/images/logo.png" alt="BabyCare logo" style="width:100%; height:100%; object-fit:contain;">
      </div>
      <span class="logo-text">BabyCare</span>
      <span class="badge-pill badge-upcoming" style="margin-left:8px;">Admin</span>
    </div>

    <button class="nav-toggle-btn" id="navToggleBtn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="#4A3E4E" stroke-width="2" stroke-linecap="round"/></svg></button>
    <div class="nav-links" id="navLinksMenu">
      <a href="admin-dashboard.html" class="nav-link-figma active">Dashboard</a>
      <a href="clinic-dashboard.html" class="nav-link-figma">Appointments</a>
      <a href="admin-pediatricians.html" class="nav-link-figma">Pediatricians</a>
      <a href="admin-baby-records.html" class="nav-link-figma">Baby Records</a>
      <div class="nav-divider-v"></div>
      <button class="logout-link" id="logoutBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 4H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h9" stroke="#8C7B8E" stroke-width="2"/><path d="M10 12h10m0 0-3-3m3 3-3 3" stroke="#8C7B8E" stroke-width="2"/></svg>
        Logout
      </button>
    </div>
  </nav>

  <main class="dashboard-body">

    <div id="pageAlert"></div>

    <div>
      <div class="card-eyebrow">System overview</div>
      <h1 class="quick-nav-title mb-0">Admin Dashboard</h1>
    </div>

    <div class="nav-grid" id="statsGrid">
      <div class="nav-card-figma">
        <div class="nav-icon-badge purple"><i data-lucide="calendar-days" style="width:24px;height:24px;"></i></div>
        <div class="nav-text"><div class="nav-card-title" id="statToday">—</div><div class="nav-card-sub">Today's Appointments</div></div>
      </div>
      <div class="nav-card-figma">
        <div class="nav-icon-badge yellow"><i data-lucide="hourglass" style="width:24px;height:24px;"></i></div>
        <div class="nav-text"><div class="nav-card-title" id="statPending">—</div><div class="nav-card-sub">Pending</div></div>
      </div>
      <div class="nav-card-figma">
        <div class="nav-icon-badge mint"><i data-lucide="circle-check" style="width:24px;height:24px;"></i></div>
        <div class="nav-text"><div class="nav-card-title" id="statCompleted">—</div><div class="nav-card-sub">Completed Today</div></div>
      </div>
      <div class="nav-card-figma">
        <div class="nav-icon-badge pink"><i data-lucide="syringe" style="width:24px;height:24px;"></i></div>
        <div class="nav-text"><div class="nav-card-title" id="statVaccines">—</div><div class="nav-card-sub">Upcoming Vaccines</div></div>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-lg-6">
        <div class="tracker-card">
          <div class="card-header-row">
            <div class="title-group-figma"><span>Add Clinic Staff</span></div>
          </div>
          <div id="staffFormAlert"></div>
          <form id="staffForm" class="fields-stack" style="gap: 14px;">
            <div class="field-group">
              <label class="field-label">Full name</label>
              <div class="input-box"><input type="text" id="staffFullName" required></div>
            </div>
            <div class="field-group">
              <label class="field-label">Email</label>
              <div class="input-box"><input type="email" id="staffEmail" required></div>
            </div>
            <div class="field-group">
              <label class="field-label">Password</label>
              <div class="input-box"><input type="password" id="staffPassword" minlength="6" required></div>
            </div>
            <div class="field-group">
              <label class="field-label">Assign to clinic</label>
              <div class="input-box">
                <select id="staffClinicSelect" required></select>
              </div>
            </div>
            <button type="submit" class="app-button" id="staffFormBtn">Create Staff Account</button>
          </form>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="tracker-card" style="padding:0;">
          <div class="card-header-row" style="padding: 24px 24px 0;">
            <div class="title-group-figma"><span>All Users</span></div>
          </div>
          <div class="table-responsive">
            <table class="table table-soft mb-0">
              <thead><tr><th>Email</th><th>Role</th><th>Joined</th></tr></thead>
              <tbody id="usersTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

  </main>

  <script src="../js/api.js"></script>
  <script src="../js/nav-toggle.js"></script>
  <script src="../js/admin-dashboard.js"></script>
  <script src="../js/vendor/lucide.min.js"></script>
  <script>
    const renderIcons = () => lucide.createIcons();
    renderIcons();
    let iconObserver;
    const renderDynamicIcons = () => {
      iconObserver.disconnect();
      renderIcons();
      iconObserver.observe(document.body, { childList: true, subtree: true });
    };
    iconObserver = new MutationObserver((mutations) => {
      if (mutations.some((mutation) => [...mutation.addedNodes].some((node) => node.nodeType === 1 && node.matches('[data-lucide]')))) renderDynamicIcons();
    });
    iconObserver.observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
