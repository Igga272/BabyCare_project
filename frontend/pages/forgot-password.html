<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — BabyCare</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>

  <div class="auth-page">
    <div class="auth-wrapper">

      <div class="auth-illustration">
        <img src="../assets/images/mother-baby.jpg" alt="Mother holding her baby" class="auth-illustration-photo">
        <div class="auth-illustration-scrim"></div>

        <div style="position:absolute; top:24px; left:24px; z-index:2;">
          <span style="font-family:'Boogaloo',cursive; font-size:22px; color:var(--color-primary);">BabyCare</span>
        </div>

        <div class="illustration-center">
          <div class="splash-text">
            <div class="splash-title" style="font-size:34px; line-height:40px;">We've got you.</div>
            <div class="splash-subtitle" style="max-width:100%; text-align:left;">Let's get you a code to reset your password.</div>
          </div>
        </div>
      </div>

      <div class="form-right">
        <div class="form-container">
          <div class="header-text">
            <div class="hello-heading">Forgot Password?</div>
            <div class="hello-subtext">Enter your email and we'll send you a reset code.</div>
          </div>

          <div id="forgotAlert" style="width: 100%;"></div>

          <form id="forgotForm" class="fields-stack" novalidate>
            <div class="field-group">
              <label class="field-label" for="email">Email Address</label>
              <div class="input-box">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 6h18v12H3z" stroke="#8B6FD1" stroke-width="2"/><path d="M3 7l9 6 9-6" stroke="#8B6FD1" stroke-width="2"/></svg>
                <input type="email" id="email" placeholder="your@email.com" required>
              </div>
            </div>

            <div class="action-stack">
              <button type="submit" class="app-button" id="forgotBtn">
                <span id="forgotBtnText">Send Reset Code</span>
              </button>
              <div class="register-link">
                <span>Remembered your password?</span>
                <a href="login.html">Login</a>
              </div>
            </div>
          </form>
        </div>

      </div>

    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/forgot-password.js"></script>
</body>
</html>
