<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Appointment — BabyCare</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar-figma">
    <div class="logo-group">
      <div class="logo-badge">
        <img src="../assets/images/logo.png" alt="BabyCare logo" style="width:100%; height:100%; object-fit:contain;">
      </div>
      <span class="logo-text">BabyCare</span>
    </div>

    <button class="nav-toggle-btn" id="navToggleBtn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="#4A3E4E" stroke-width="2" stroke-linecap="round"/></svg></button>
    <div class="nav-links" id="navLinksMenu">
      <a href="dashboard.html" class="nav-link-figma">Dashboard</a>
      <a href="vaccines.html" class="nav-link-figma">Vaccine Schedule</a>
      <a href="book-appointment.html" class="nav-link-figma active">Appointments</a>
      <a href="checkups.html" class="nav-link-figma">Checkup Log</a>
      <div class="nav-divider-v"></div>
      <button class="logout-link" id="logoutBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 4H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h9" stroke="#8C7B8E" stroke-width="2"/><path d="M10 12h10m0 0-3-3m3 3-3 3" stroke="#8C7B8E" stroke-width="2"/></svg>
        Logout
      </button>
    </div>
  </nav>

  <main class="dashboard-body">

    <div id="pageAlert"></div>

    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
      <div>
        <div class="card-eyebrow">Appointments</div>
        <h1 class="quick-nav-title mb-0">Book an Appointment</h1>
      </div>
      <a href="appointments.html" class="app-button" style="width:auto; padding:12px 22px; background:#fff; color:var(--color-primary); border:2px solid var(--color-border); box-shadow:none;">View history</a>
    </div>

    <div class="tracker-card" style="max-width: 640px;">
      <form id="bookingForm" class="fields-stack" style="gap: 16px;">
        <div class="field-group">
          <label class="field-label">Baby</label>
          <div class="input-box">
            <select id="babySelect" required></select>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label">Doctor</label>
          <div class="input-box">
            <select id="doctorSelect" required></select>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label">Reason</label>
          <div class="input-box">
            <select id="reasonSelect" required>
              <option value="Checkup">Checkup</option>
              <option value="Vaccination">Vaccination</option>
              <option value="Follow-up">Follow-up</option>
              <option value="Consultation">Consultation</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div class="col-6">
            <div class="field-group">
              <label class="field-label">Date</label>
              <div class="input-box"><input type="date" id="appointmentDate" required></div>
            </div>
          </div>
          <div class="col-6">
            <div class="field-group">
              <label class="field-label">Available Time</label>
              <div class="input-box">
                <select id="appointmentTime" required>
                  <option value="">Select a doctor first</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <div id="availabilityNote" class="text-muted-soft small"></div>

        <div class="field-group">
          <label class="field-label">Notes (optional)</label>
          <div class="input-box">
            <input type="text" id="notes" placeholder="e.g. Follow-up checkup">
          </div>
        </div>

        <button type="submit" class="app-button" id="bookBtn">
          <span id="bookBtnText">Review Booking</span>
        </button>
      </form>
    </div>

  </main>

  <!-- Confirmation Modal -->
  <div class="modal fade" id="confirmModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="border-radius: 24px; border: none;">
        <div class="modal-header border-0">
          <h5 class="modal-title" style="font-family:'Boogaloo',cursive; color:var(--color-text);">Appointment Request</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="confirmModalAlert"></div>
          <div class="tracker-card" style="box-shadow:none; border:2px solid var(--color-border);">
            <div class="d-flex justify-content-between py-1"><span class="text-muted-soft">Baby</span><strong id="confirmBaby"></strong></div>
            <div class="d-flex justify-content-between py-1"><span class="text-muted-soft">Doctor</span><strong id="confirmDoctor"></strong></div>
            <div class="d-flex justify-content-between py-1"><span class="text-muted-soft">Date</span><strong id="confirmDate"></strong></div>
            <div class="d-flex justify-content-between py-1"><span class="text-muted-soft">Time</span><strong id="confirmTime"></strong></div>
            <div class="d-flex justify-content-between py-1"><span class="text-muted-soft">Reason</span><strong id="confirmReason"></strong></div>
          </div>
          <button type="button" class="app-button mt-3" id="confirmBookBtn">Confirm Booking</button>
          <button type="button" class="btn btn-link w-100 text-muted-soft mt-1" data-bs-dismiss="modal">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>

  <script src="../js/api.js"></script>
  <script src="../js/nav-toggle.js"></script>
  <script src="../js/book-appointment.js"></script>
  <script src="../js/vendor/lucide.min.js"></script>
  <script>
    const renderIcons = () => lucide.createIcons();
    renderIcons();
    let iconObserver;
    const renderDynamicIcons = () => {
      iconObserver.disconnect();
      renderIcons();
      iconObserver.observe(document.body, { childList: true, subtree: true });
    };
    iconObserver = new MutationObserver((mutations) => {
      if (mutations.some((mutation) => [...mutation.addedNodes].some((node) => node.nodeType === 1 && node.matches('[data-lucide]')))) renderDynamicIcons();
    });
    iconObserver.observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
