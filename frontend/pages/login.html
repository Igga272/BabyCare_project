<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — BabyCare</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>

  <div class="auth-page">
    <div class="auth-wrapper">

      <div class="auth-illustration">
        <img src="../assets/images/mother-baby.jpg" alt="Mother holding her baby" class="auth-illustration-photo">
        <div class="auth-illustration-scrim"></div>

        <div style="position:absolute; top:24px; left:24px; z-index:2;">
          <span style="font-family:'Boogaloo',cursive; font-size:22px; color:var(--color-primary);">BabyCare</span>
        </div>

        <div class="illustration-center">
          <div class="splash-text">
            <div class="splash-title" style="font-size:34px; line-height:40px;">Every step of your baby's journey, together.</div>
            <div class="splash-subtitle" style="max-width:100%; text-align:left;">Vaccines, checkups, and growth — all in one warm, caring place.</div>
          </div>
        </div>
      </div>

      <div class="form-right">
        <div class="form-container">
          <div class="header-text">
            <div class="hello-heading">Hello Parents!</div>
            <div class="hello-subtext">Sign in to manage your little one's healthcare trackers.</div>
          </div>

          <div id="loginAlert" style="width: 100%;"></div>

          <form id="loginForm" class="fields-stack" novalidate>
            <div class="field-group">
              <label class="field-label" for="email">Email Address</label>
              <div class="input-box">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 6h18v12H3z" stroke="#8B6FD1" stroke-width="2"/><path d="M3 7l9 6 9-6" stroke="#8B6FD1" stroke-width="2"/></svg>
                <input type="email" id="email" placeholder="example1@gmail.com" required>
              </div>
            </div>

            <div class="field-group">
              <label class="field-label" for="password">Password</label>
              <div class="input-box">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="#8B6FD1" stroke-width="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="#8B6FD1" stroke-width="2"/></svg>
                <input type="password" id="password" placeholder="••••••••••••" required>
                <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('password', this)">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="#8C7B8E" stroke-width="2"/><circle cx="12" cy="12" r="3" stroke="#8C7B8E" stroke-width="2"/></svg>
                </button>
              </div>
            </div>

            <div class="forgot-password">
              <a href="forgot-password.html">Forgot Password?</a>
            </div>

            <div class="action-stack">
              <button type="submit" class="app-button" id="loginBtn">
                <span id="loginBtnText">Login</span>
              </button>
              <div class="register-link">
                <span>Don't have an account?</span>
                <a href="register.html">Register</a>
              </div>
            </div>
          </form>
        </div>

      </div>

    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/password-toggle.js"></script>
</body>
</html>
