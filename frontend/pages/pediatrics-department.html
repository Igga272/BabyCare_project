<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pediatrics Department — BabyCare</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar-figma">
    <div class="logo-group">
      <div class="logo-badge">
        <img src="../assets/images/logo.png" alt="BabyCare logo" style="width:100%; height:100%; object-fit:contain;">
      </div>
      <span class="logo-text">BabyCare</span>
    </div>

    <button class="nav-toggle-btn" id="navToggleBtn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="#4A3E4E" stroke-width="2" stroke-linecap="round"/></svg></button>
    <div class="nav-links" id="navLinksMenu">
      <a href="my-babies.html" class="nav-link-figma">My Babies</a>
      <a href="dashboard.html" class="nav-link-figma">Dashboard</a>
      <a href="pediatrics-department.html" class="nav-link-figma active">Pediatrics Dept.</a>
      <div class="nav-divider-v"></div>
      <button class="logout-link" id="logoutBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 4H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h9" stroke="#8C7B8E" stroke-width="2"/><path d="M10 12h10m0 0-3-3m3 3-3 3" stroke="#8C7B8E" stroke-width="2"/></svg>
        Logout
      </button>
    </div>
  </nav>

  <main class="dashboard-body">

    <div id="pageAlert"></div>

    <div>
      <div class="card-eyebrow">Where your baby is cared for</div>
      <h1 class="quick-nav-title mb-0" id="hospitalName">Pediatrics Department</h1>
    </div>

    <div class="row g-4">
      <div class="col-lg-8">
        <div class="tracker-card">
          <div class="card-header-row">
            <div class="title-group-figma"><span style="font-size:20px;">Our Pediatricians</span></div>
          </div>

          <div class="row g-3 mb-3" style="border-bottom: 1px solid var(--color-border); padding-bottom: 16px;">
            <div class="col-6 col-md-3"><div class="nav-card-sub">Address</div><div class="fw-bold" id="hospitalAddress" style="font-size:14px;">—</div></div>
            <div class="col-6 col-md-3"><div class="nav-card-sub">Floor / Room</div><div class="fw-bold" id="hospitalFloor" style="font-size:14px;">—</div></div>
            <div class="col-6 col-md-3"><div class="nav-card-sub">Hours</div><div class="fw-bold" id="hospitalHours" style="font-size:14px;">—</div></div>
            <div class="col-6 col-md-3"><div class="nav-card-sub">Contact</div><div class="fw-bold" id="hospitalContact" style="font-size:14px;">—</div></div>
          </div>

          <div id="doctorGrid" class="nav-grid"></div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="tracker-card" style="padding: 0; overflow: hidden;">
          <div id="hospitalMap" style="width: 100%; height: 280px;"></div>
        </div>
      </div>
    </div>

  </main>

  <script src="../js/api.js"></script>
  <script src="../js/nav-toggle.js"></script>
  <script src="../js/pediatrics-department.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      requireAuth();
      document.getElementById('logoutBtn').addEventListener('click', () => {
        clearToken();
        window.location.href = 'login.html';
      });
    });
  </script>
  <script src="../js/vendor/lucide.min.js"></script>
  <script>
    const renderIcons = () => lucide.createIcons();
    renderIcons();    let iconObserver;
    const renderDynamicIcons = () => {
      iconObserver.disconnect();
      renderIcons();
      iconObserver.observe(document.body, { childList: true, subtree: true });
    };
    iconObserver = new MutationObserver((mutations) => {
      if (mutations.some((mutation) => [...mutation.addedNodes].some((node) => node.nodeType === 1 && node.matches('[data-lucide]')))) renderDynamicIcons();
    });
    iconObserver.observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
