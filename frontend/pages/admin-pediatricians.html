<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pediatricians — BabyCare</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar-figma">
    <div class="logo-group">
      <div class="logo-badge">
        <img src="../assets/images/logo.png" alt="BabyCare logo" style="width:100%; height:100%; object-fit:contain;">
      </div>
      <span class="logo-text">BabyCare</span>
      <span class="badge-pill badge-completed" style="margin-left:8px;">Staff</span>
    </div>

    <button class="nav-toggle-btn" id="navToggleBtn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="#4A3E4E" stroke-width="2" stroke-linecap="round"/></svg></button>
    <div class="nav-links" id="navLinksMenu">
      <a href="clinic-dashboard.html" class="nav-link-figma">Appointments</a>
      <a href="admin-pediatricians.html" class="nav-link-figma active">Pediatricians</a>
      <div class="nav-divider-v"></div>
      <button class="logout-link" id="logoutBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 4H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h9" stroke="#8C7B8E" stroke-width="2"/><path d="M10 12h10m0 0-3-3m3 3-3 3" stroke="#8C7B8E" stroke-width="2"/></svg>
        Logout
      </button>
    </div>
  </nav>

  <main class="dashboard-body">

    <div id="pageAlert"></div>

    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
      <div>
        <div class="card-eyebrow">Staff directory</div>
        <h1 class="quick-nav-title mb-0">Pediatricians</h1>
      </div>
      <button type="button" class="app-button" style="width:auto; padding:12px 22px;" data-bs-toggle="modal" data-bs-target="#doctorModal" onclick="openAddDoctorModal()">+ Add Doctor</button>
    </div>

    <div id="doctorGrid" class="nav-grid"></div>

  </main>

  <!-- Add/Edit Doctor Modal -->
  <div class="modal fade" id="doctorModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="border-radius: 24px; border: none;">
        <div class="modal-header border-0">
          <h5 class="modal-title" style="font-family:'Boogaloo',cursive; color:var(--color-text);" id="doctorModalTitle">Add Doctor</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="doctorModalAlert"></div>
          <form id="doctorForm" class="fields-stack" style="gap: 14px;">
            <input type="hidden" id="doctorId">
            <div class="field-group">
              <label class="field-label">Full name</label>
              <div class="input-box"><input type="text" id="doctorFullName" placeholder="Dr. Juan Dela Cruz" required></div>
            </div>
            <div class="field-group">
              <label class="field-label">Specialization</label>
              <div class="input-box"><input type="text" id="doctorSpecialization" placeholder="Pediatrics"></div>
            </div>
            <div class="field-group">
              <label class="field-label">Status</label>
              <div class="input-box">
                <select id="doctorStatus">
                  <option value="available">Available</option>
                  <option value="unavailable">Unavailable</option>
                </select>
              </div>
            </div>
            <div class="field-group">
              <label class="field-label">Available days</label>
              <div class="d-flex flex-wrap gap-2" id="dayCheckboxes">
                <label class="btn btn-sm btn-outline-primary day-check"><input type="checkbox" value="Monday" class="d-none"> Mon</label>
                <label class="btn btn-sm btn-outline-primary day-check"><input type="checkbox" value="Tuesday" class="d-none"> Tue</label>
                <label class="btn btn-sm btn-outline-primary day-check"><input type="checkbox" value="Wednesday" class="d-none"> Wed</label>
                <label class="btn btn-sm btn-outline-primary day-check"><input type="checkbox" value="Thursday" class="d-none"> Thu</label>
                <label class="btn btn-sm btn-outline-primary day-check"><input type="checkbox" value="Friday" class="d-none"> Fri</label>
                <label class="btn btn-sm btn-outline-primary day-check"><input type="checkbox" value="Saturday" class="d-none"> Sat</label>
                <label class="btn btn-sm btn-outline-primary day-check"><input type="checkbox" value="Sunday" class="d-none"> Sun</label>
              </div>
            </div>
            <div class="row">
              <div class="col-6">
                <div class="field-group">
                  <label class="field-label">Available from</label>
                  <div class="input-box"><input type="time" id="doctorTimeStart"></div>
                </div>
              </div>
              <div class="col-6">
                <div class="field-group">
                  <label class="field-label">Available until</label>
                  <div class="input-box"><input type="time" id="doctorTimeEnd"></div>
                </div>
              </div>
            </div>
            <button type="submit" class="app-button" id="doctorFormBtn">Save Doctor</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <style>
    .day-check input:checked + span, .day-check.checked {
      background: var(--color-primary) !important;
      color: #fff !important;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/nav-toggle.js"></script>
  <script src="../js/admin-pediatricians.js"></script>
  <script src="../js/vendor/lucide.min.js"></script>
  <script>
    const renderIcons = () => lucide.createIcons();
    renderIcons();
    let iconObserver;
    const renderDynamicIcons = () => {
      iconObserver.disconnect();
      renderIcons();
      iconObserver.observe(document.body, { childList: true, subtree: true });
    };
    iconObserver = new MutationObserver((mutations) => {
      if (mutations.some((mutation) => [...mutation.addedNodes].some((node) => node.nodeType === 1 && node.matches('[data-lucide]')))) renderDynamicIcons();
    });
    iconObserver.observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
