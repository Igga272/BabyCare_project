<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — BabyCare</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>

  <div class="auth-page">
    <div class="auth-wrapper">

      <div class="auth-illustration">
        <img src="../assets/images/mother-baby.jpg" alt="Mother holding her baby" class="auth-illustration-photo">
        <div class="auth-illustration-scrim"></div>

        <div style="position:absolute; top:24px; left:24px; z-index:2;">
          <span style="font-size:22px; color:var(--color-primary);">BabyCare</span>
        </div>

        <div class="illustration-center">
          <div class="splash-text">
            <div class="splash-title" style="font-size:34px; line-height:40px;">Almost done!</div>
            <div class="splash-subtitle" style="max-width:100%; text-align:left;">Enter the code we sent you and choose a new password.</div>
          </div>
        </div>
      </div>

      <div class="form-right">
        <div class="form-container">
          <div class="header-text">
            <div class="hello-heading">Reset Password</div>
            <div class="hello-subtext">For <strong id="emailDisplay">your email</strong></div>
          </div>

          <div id="resetAlert" style="width: 100%;"></div>

          <form id="codeForm" class="fields-stack" novalidate>
            <div class="field-group">
              <label class="field-label">Reset Code</label>
              <div class="otp-input-group" id="resetCodeBoxes">
                <input type="text" maxlength="1" inputmode="numeric" class="otp-box">
                <input type="text" maxlength="1" inputmode="numeric" class="otp-box">
                <input type="text" maxlength="1" inputmode="numeric" class="otp-box">
                <input type="text" maxlength="1" inputmode="numeric" class="otp-box">
                <input type="text" maxlength="1" inputmode="numeric" class="otp-box">
                <input type="text" maxlength="1" inputmode="numeric" class="otp-box">
              </div>
            </div>

            <div class="action-stack">
              <button type="submit" class="app-button" id="verifyCodeBtn">
                <span id="verifyCodeBtnText">Verify Code</span>
              </button>
              <div class="register-link">
                <span>Remembered it after all?</span>
                <a href="login.html">Login</a>
              </div>
            </div>
          </form>

          <form id="resetForm" class="fields-stack d-none" novalidate>
            <div class="field-group">
              <label class="field-label" for="newPassword">New Password</label>
              <div class="input-box">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="#8B6FD1" stroke-width="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="#8B6FD1" stroke-width="2"/></svg>
                <input type="password" id="newPassword" placeholder="Minimum 8 characters" minlength="8" required>
                <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('newPassword', this)">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="#8C7B8E" stroke-width="2"/><circle cx="12" cy="12" r="3" stroke="#8C7B8E" stroke-width="2"/></svg>
                </button>
              </div>
            </div>

            <div class="field-group">
              <label class="field-label" for="confirmNewPassword">Confirm New Password</label>
              <div class="input-box">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="#8B6FD1" stroke-width="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="#8B6FD1" stroke-width="2"/></svg>
                <input type="password" id="confirmNewPassword" placeholder="Re-enter new password" required>
                <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('confirmNewPassword', this)">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="#8C7B8E" stroke-width="2"/><circle cx="12" cy="12" r="3" stroke="#8C7B8E" stroke-width="2"/></svg>
                </button>
              </div>
            </div>

            <div class="action-stack">
              <button type="submit" class="app-button" id="resetBtn">
                <span id="resetBtnText">Reset Password</span>
              </button>
            </div>
          </form>
        </div>

      </div>

    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/password-reset.js"></script>
  <script src="../js/password-toggle.js"></script>
</body>
</html>
